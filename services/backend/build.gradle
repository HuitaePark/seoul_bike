plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.seoulbike'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

springBoot {
	// /api/system/status가 버전과 빌드 시각을 보여주도록 META-INF/build-info.properties를 만든다.
	buildInfo()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.webjars:swagger-ui:5.33.2'
	implementation 'org.webjars:webjars-locator-lite'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-redpanda'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
	// 실행 jar 하나만 만든다. Dockerfile은 backend.jar를 복사한다.
	enabled = false
}

tasks.named('bootJar') {
	archiveFileName = 'backend.jar'
}

// 계약 원본은 docs/specs에 둔다. 빌드할 때 복사해서 /specs/*.yaml로 서빙하고 /swagger/에서 보여준다.
// Docker 빌드는 compose additional_contexts로 넘긴 경로(-PspecsDir=/specs)를 쓴다.
def specsDir = providers.gradleProperty('specsDir').orElse('../../docs/specs')
tasks.named('processResources', ProcessResources) {
	from(specsDir.map { file(it) }) {
		include '*.yaml'
		into 'static/specs'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
