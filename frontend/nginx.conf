# 화면(Vue)과 API를 같은 출처로 묶는다. 브라우저는 backend 주소를 따로 알 필요가 없다.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # backend 컨테이너는 배포 때마다 새로 떠서 IP가 바뀐다. 이름을 시작할 때 한 번만 찾으면 옛 IP로 보내 502가 난다.
    # proxy_pass에 변수를 쓰면 요청마다 Docker 내장 DNS(127.0.0.11)로 다시 찾는다 (2초 캐시).
    # 순차 교체(infra/deploy.sh) 중에는 이름이 둘로 풀리고, 내린 컨테이너의 IP는 캐시가 남은 동안 응답이 없다(대기).
    # 연결 대기를 1초로 두어 바로 다음 주소로 넘긴다. 같은 서버 안이라 정상 연결은 1ms도 안 걸린다.
    resolver 127.0.0.11 valid=2s ipv6=off;
    proxy_connect_timeout 1s;
    set $backend http://backend:8080;

    # 공개 주소(Tailscale Funnel)는 느리다 (2026-10-21 측정 약 46KB/s: Swagger JS 1.6MB에 34초). 글자로 된 자원은 압축한다.
    # backend가 넘겨 준 응답(/api JSON 등)도 압축한다(gzip_proxied any). SSE(text/event-stream)는 목록에 없어 압축하지 않고 흘려보낸다.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # SPA: 없는 경로는 index.html로 보내 Vue Router가 처리한다.
    # 보안 헤더는 화면(HTML)에만 붙인다. /api·/swagger 응답에는 Spring Security가 이미 붙이고, 겹치면
    # X-Frame-Options 값이 두 개가 되어 브라우저가 무시할 수 있다. CSP는 다른 사이트에 끼워 넣기(frame)·플러그인·
    # base 바꿔치기만 막는다. 지도 타일 같은 외부 자원을 쓸 화면이 있어 default-src는 두지 않는다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        # 지도 SDK·타일(카카오맵, OSM)은 Referer로 등록 도메인을 확인하므로 다른 사이트에는 출처(도메인)만 보낸다.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 이 location에 add_header가 있으면 위(location /)의 헤더를 이어받지 않으므로 다시 붙인다.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SSE(작업 진행 이벤트)가 지나가므로 버퍼링을 끄고 오래 열어 둔다.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Swagger 화면 자원(webjars). backend는 모든 응답에 no-store를 붙여 들어올 때마다 1.6MB를 다시 받는다.
    # swagger-ui 판(버전)을 올릴 때만 바뀌므로 하루 캐시한다 (판을 올리면 하루 동안 옛 화면이 보일 수 있다).
    location ^~ /webjars/ {
        proxy_pass $backend;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # 계약 화면(Swagger)과 상태 확인. 계약 파일(.yaml)은 backend가 application/octet-stream으로 줘서 여기서만 그 형식도 압축한다.
    location ~ ^/(swagger|specs|actuator)(/|$) {
        proxy_pass $backend;
        gzip_types text/css text/plain text/javascript application/javascript application/json application/octet-stream;
    }

    location = /status {
        proxy_pass $backend/;
    }
}
