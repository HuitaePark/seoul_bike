# 화면(Vue)과 API를 같은 출처로 묶는다. 브라우저는 backend 주소를 따로 알 필요가 없다.
server {
    listen 80;
    root /usr/share/nginx/html;

    # backend 컨테이너는 배포 때마다 새로 떠서 IP가 바뀐다. 이름을 시작할 때 한 번만 찾으면 옛 IP로 보내 502가 난다.
    # proxy_pass에 변수를 쓰면 요청마다 Docker 내장 DNS(127.0.0.11)로 다시 찾는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # SPA: 없는 경로는 index.html로 보내 Vue Router가 처리한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSE(작업 진행 이벤트)가 지나가므로 버퍼링을 끄고 오래 열어 둔다.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 계약 화면(Swagger)과 상태 확인
    location ~ ^/(swagger|specs|webjars|actuator)(/|$) {
        proxy_pass $backend;
    }

    location = /status {
        proxy_pass $backend/;
    }
}
