openapi: 3.1.0
info:
  title: 따릉이 재배치 에이전트 · 내부 API (/internal/**)
  version: 0.6.0-draft
  summary: business-mcp가 호출하는 backend 내부 API
  description: |
    **초안 v0.6.** MCP·에이전트 담당 확인 전이다.

    - v0.6: 현재 계획 조회·계획 활성화·경로 적용 구현 범위. 승인 하나에 한 번(재시도는 처음 결과), 기준 버전이 바뀐 후보는 409,
      SUBMIT_PLAN 카드는 `planId`로 활성화할 계획을 가리킨다. 활성화에 404 `PLAN_NOT_FOUND`.
    - v0.5: `get_audit` → `GET /internal/shifts/{shiftId}/audit`, `AuditEvent` (ISS-06).
    - v0.4: 서비스 토큰 규칙, 현장 보고 조회·제약 추가 구현 범위(재시도 시 같은 제약), 400 `INVALID_REQUEST`.
    - v0.3: `FieldReport`에 `loaded`·`unloaded`, `issue` 값 목록. 같은 모양이 `ai.tasks` FIELD_REPORT 명령의 `report`로도 간다.
    - v0.2: 경로 변경 승인 순서. 후보(`PlanCandidate`)에 `requiredApprovers`, 적용 API의 확인 규칙.

    - 공개 주소(화면 nginx)로는 열리지 않는다. backend 포트는 서버 자신(127.0.0.1)에만 열려 있어 서버 안의 프로그램과
      docker network 안의 서비스만 부를 수 있고, 그 안에서는 **서비스 토큰이 유일한 보호**다.
    - **모든 요청에 `X-Internal-Token`이 있어야 한다.** 없거나 틀리면 401 `UNAUTHORIZED`. 사용자 JWT로는 열리지 않는다.
      backend에 토큰이 설정돼 있지 않으면 모두 401이다.
    - 업무 규칙(변경 등급, 승인 주체)은 backend에만 있다. business-mcp는 규칙을 복제하지 않고 이 API를 부른다.
    - **변경 API 3개는 필요한 승인이 모두 `APPROVED`가 아니면 403을 돌려준다.** 에이전트 interrupt와 별개로
      backend가 한 번 더 막는다 (UR-18 "사람 승인 없이 바꾸지 않음").
    - 오류 메시지는 MCP `ToolError`로 그대로 전달되므로, 모델이 다시 호출할 수 있는 정보를 담는다
      (예 없는 대여소면 권역 안의 비슷한 대여소 목록).

    | MCP 도구 | 내부 API |
    | --- | --- |
    | get_risk_stations | GET /internal/stations/risk |
    | get_station_detail | GET /internal/stations/{stationId} |
    | get_forecast | GET /internal/forecasts |
    | get_current_plan | GET /internal/shifts/{shiftId}/plan |
    | get_truck_status | GET /internal/shifts/{shiftId}/trucks |
    | get_field_reports | GET /internal/shifts/{shiftId}/reports |
    | get_audit | GET /internal/shifts/{shiftId}/audit |
    | request_route_plan | POST /internal/plans/solve |
    | add_constraint (변경) | POST /internal/constraints |
    | submit_plan (변경) | POST /internal/plans/{planId}/activate |
    | propose_route_change (변경) | POST /internal/routes/{truckId}/apply |
servers:
  - url: http://backend:8080
    description: docker network 안
security:
  - internalToken: []

paths:
  /internal/stations/risk:
    get:
      operationId: getRiskStations
      summary: 빈·과적재 위험 대여소
      parameters:
        - name: regionId
          in: query
          required: true
          schema: { type: string }
        - name: horizonH
          in: query
          schema: { type: integer, minimum: 1, maximum: 6, default: 3 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 우선순위 내림차순
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RiskStation' }
        '404': { $ref: '#/components/responses/RegionNotFound' }

  /internal/stations/{stationId}:
    get:
      operationId: getStationDetail
      summary: 대여소 상세
      parameters:
        - name: stationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 대여소
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationDetail' }
        '404': { $ref: '#/components/responses/StationNotFound' }

  /internal/forecasts:
    get:
      operationId: getForecasts
      summary: 대여소별 예측
      parameters:
        - name: stationIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 200
            items: { type: string }
        - name: start
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: horizonH
          in: query
          schema: { type: integer, minimum: 1, maximum: 6, default: 3 }
      responses:
        '200':
          description: 예측
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Forecast' }
        '404': { $ref: '#/components/responses/StationNotFound' }

  /internal/shifts/{shiftId}/plan:
    get:
      operationId: getCurrentPlan
      summary: 현재 계획
      description: 근무조의 ACTIVE 계획. 없으면 404 `SHIFT_NOT_FOUND`("근무조 …에 활성 계획이 없다").
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: 계획 (공개 API Plan과 같은 형식)
          content:
            application/json:
              schema: { $ref: 'openapi.yaml#/components/schemas/Plan' }
        '404': { $ref: '#/components/responses/ShiftNotFound' }

  /internal/shifts/{shiftId}/trucks:
    get:
      operationId: getTruckStatus
      summary: 트럭 현재 위치·적재량·남은 정류장
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: 트럭 상태
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TruckState' }
        '404': { $ref: '#/components/responses/ShiftNotFound' }

  /internal/shifts/{shiftId}/reports:
    get:
      operationId: getFieldReports
      summary: 근무조 현장 보고
      description: |
        보고 순서대로 돌려준다. 기사 이름 대신 `driver`는 `"{truckId} 기사"`로 가린다 (Harness Guardrails, agent에 개인정보를 보내지 않는다).
        근무조 표가 생기기 전(M3)에는 없는 근무조도 404 대신 빈 목록이다.
      parameters:
        - $ref: '#/components/parameters/ShiftId'
        - name: since
          in: query
          description: 이 시각 **뒤**의 보고만 (그 시각은 뺀다)
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 보고 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FieldReport' }
        '404': { $ref: '#/components/responses/ShiftNotFound' }

  /internal/shifts/{shiftId}/audit:
    get:
      operationId: getAudit
      summary: 근무조 감사 기록
      description: |
        승인·거절, 현장 보고, 제약 추가, 계획 활성화, 경로 적용 순서대로. FR-08 질의의 근거, FR-18의 증거다.
        기록은 append-only라 고치거나 지울 수 없다. 제약 추가·계획 활성화의 행위자는 승인한 관리자, 경로 적용은 수락한 그 트럭 기사다.
      parameters:
        - $ref: '#/components/parameters/ShiftId'
        - name: since
          in: query
          description: 이 시각 **뒤**의 기록만 (그 시각은 빼서, 마지막으로 받은 시각을 다시 넣어도 중복이 없다)
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 감사 기록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }

  /internal/plans/solve:
    post:
      operationId: requestRoutePlan
      summary: 경로 계산 요청 (계획 초안 또는 재경로)
      description: |
        backend가 Kafka `solve.requests`로 optimizer에 보내고 `solve.results`를 기다린다 (최대 60초).
        시간을 넘기면 탐욕 휴리스틱 임시안을 `provisional: true`로 돌려준다.
        결과는 아직 활성화되지 않은 후보이며, 활성 계획과 비교한 변경 등급을 함께 준다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolveRequest' }
      responses:
        '200':
          description: 후보 계획
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanCandidate' }
        '404': { $ref: '#/components/responses/ShiftNotFound' }

  /internal/constraints:
    post:
      operationId: addConstraint
      summary: 제약 추가 (변경, 승인 필요)
      description: |
        이 작업(`taskId`)의 **ADD_CONSTRAINT 카드를 관리자가 승인**했어야 하고, `shiftId`가 그 작업의 근무조여야 한다
        (아니면 403 `APPROVAL_REQUIRED`, 이유를 문장에 적는다).
        **같은 `approvalId`로 같은 내용을 다시 부르면 처음 만든 제약을 그대로 돌려준다** (agent 재시도에 안전). 내용이 다르면 409.
        `validTo`가 `validFrom`보다 앞이거나, `TARGET_ADJUST`·`INVENTORY_OVERRIDE`에 `value`가 없거나,
        `INVENTORY_OVERRIDE`의 `value`가 음수면 400 `INVALID_REQUEST`. 대여소가 있는지(404)는 대여소 데이터가 들어오면(M3) 확인한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConstraintRequest' }
      responses:
        '201':
          description: 추가됨 (재시도면 처음 만든 제약)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Constraint' }
        '400':
          description: 입력 오류 (INVALID_REQUEST)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ToolProblem' }
        '403': { $ref: '#/components/responses/ApprovalRequired' }
        '404': { $ref: '#/components/responses/StationNotFound' }
        '409':
          description: 같은 `approvalId`로 이미 다른 내용의 제약을 넣었다 (APPROVAL_ALREADY_USED). 새 제약은 새 승인을 받는다
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ToolProblem' }

  /internal/plans/{planId}/activate:
    post:
      operationId: activatePlan
      summary: 계획 활성화 (변경, 관리자 승인 필요)
      description: |
        이 작업(`taskId`)의 **SUBMIT_PLAN 카드를 관리자가 승인**했어야 하고, 작업의 근무조가 계획의 근무조여야 하며,
        카드가 **이 계획을 가리켜야** 한다 (카드의 `planId` 또는 `candidateId`가 `planId`와 같다). 어느 계획인지 적히지 않은
        카드도 403 `APPROVAL_REQUIRED`다.
        활성화할 수 있는 것은 DRAFT·PROPOSED 계획이다. version은 그대로이고, 이전 ACTIVE는 CLOSED가 된다. 감사 기록 `PLAN_ACTIVATED`.
        **같은 `approvalId`로 다시 부르면 처음 활성화한 계획을 그대로 돌려준다** (기록을 더하지 않는다). 이미 다른 변경에 쓴 승인이면 409 `APPROVAL_ALREADY_USED`.
        409: 이미 다른 승인으로 ACTIVE(`PLAN_ALREADY_ACTIVE`), CLOSED·REJECTED이거나 후보를 계산한 뒤 활성 계획이 바뀜(`PLAN_SUPERSEDED`, 새 후보를 받는다).
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovedChange' }
      responses:
        '200':
          description: 활성화된 계획 (재시도면 처음 활성화한 계획)
          content:
            application/json:
              schema: { $ref: 'openapi.yaml#/components/schemas/Plan' }
        '403': { $ref: '#/components/responses/ApprovalRequired' }
        '404':
          description: 없는 계획 (PLAN_NOT_FOUND)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ToolProblem' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/routes/{truckId}/apply:
    post:
      operationId: applyRouteChange
      summary: 트럭 경로 변경 적용 (변경, 후보의 requiredApprovers 승인 필요)
      description: |
        `approvalId`는 이 후보의 마지막 카드(기사 수락)다. backend는 같은 작업에서 이 후보(`candidateId`)의
        `requiredApprovers`가 순서대로 모두 APPROVED인지 확인하고, 하나라도 없으면 403을 돌려준다.
        기사 승인은 이 트럭 기사의 것이어야 한다. 등급이 NONE이면 바꿀 것이 없어 호출하지 않는다 (부르면 409 `NOTHING_TO_APPLY`).
        등급은 카드 값을 믿지 않고 후보 전체를 지금 활성 계획과 비교해 다시 계산한다.
        적용하면 활성 계획을 복사해 **이 트럭 경로만** 후보의 것으로 바꾼 새 version(가장 큰 version + 1)이 ACTIVE가 되고,
        이전 ACTIVE는 CLOSED가 된다. 감사 기록 `ROUTE_CHANGED`(행위자는 수락한 기사).
        **같은 `approvalId`로 같은 트럭·후보를 다시 부르면 처음 적용한 경로를 돌려준다.** 다른 트럭·후보면 409 `APPROVAL_ALREADY_USED`.
        409: 후보가 없거나 PROPOSED가 아님·이 트럭 경로가 없음, 활성 계획이 없음(`NO_ACTIVE_PLAN`),
        **후보를 계산한 뒤 활성 계획이 바뀜(`STALE_CANDIDATE`, `request_route_plan`으로 새 후보를 받아 다시 승인을 받는다)**.
      parameters:
        - name: truckId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApprovedChange'
                - type: object
                  required: [candidateId]
                  properties:
                    candidateId: { type: string }
      responses:
        '200':
          description: 적용된 경로 (재시도면 처음 적용한 경로)
          content:
            application/json:
              schema: { $ref: 'openapi.yaml#/components/schemas/Route' }
        '403': { $ref: '#/components/responses/ApprovalRequired' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: docker network 밖으로 열리지 않더라도 서비스 토큰으로 한 번 더 막는다

  parameters:
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { type: string }

  responses:
    ApprovalRequired:
      description: approvalId가 없거나 APPROVED가 아니거나 승인 주체가 맞지 않음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ToolProblem' }
          example:
            type: about:blank
            title: 승인되지 않은 변경
            status: 403
            code: APPROVAL_REQUIRED
            detail: approvalId 8f1c…는 PENDING 상태다. 승인 후 다시 호출한다.
    StationNotFound:
      description: 없는 대여소. 다시 호출할 수 있게 후보를 준다
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ToolProblem' }
          example:
            type: about:blank
            title: 대여소 없음
            status: 404
            code: STATION_NOT_FOUND
            detail: "'ST-9999' 대여소가 없다. 권역 안의 가까운 대여소: ST-1023, ST-1031"
            suggestions: [ST-1023, ST-1031]
    RegionNotFound:
      description: 없는 권역
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ToolProblem' }
    ShiftNotFound:
      description: 없는 근무조
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ToolProblem' }
    Conflict:
      description: 이미 활성화됐거나 더 새로운 후보로 대체됨
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ToolProblem' }

  schemas:
    RiskStation:
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/StationStatus'
        - type: object
          required: [neededBikes, priority, reasons]
          properties:
            neededBikes:
              type: integer
              description: 양수 회수, 음수 배치
            priority: { type: number }
            emptyAt:
              type: [string, 'null']
              format: date-time
              description: 예상 빈 시각
            reasons:
              type: array
              items: { type: string }

    StationDetail:
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/StationStatus'
        - type: object
          properties:
            district: { type: string }
            recentReports:
              type: array
              items: { $ref: '#/components/schemas/FieldReport' }

    Forecast:
      type: object
      required: [stationId, start, horizonH, rentals, returns]
      properties:
        stationId: { type: string }
        start: { type: string, format: date-time }
        horizonH: { type: integer }
        rentals: { type: number }
        returns: { type: number }
        modelVersion: { type: string }

    TruckState:
      type: object
      required: [truckId, capacity, load, remainingStops]
      properties:
        truckId: { type: string }
        capacity: { type: integer }
        load: { type: integer }
        lat: { type: [number, 'null'] }
        lon: { type: [number, 'null'] }
        shiftEnd: { type: string, format: date-time }
        remainingStops:
          type: array
          items: { $ref: 'openapi.yaml#/components/schemas/Stop' }

    FieldReport:
      type: object
      required: [reportId, truckId, stationId, actualBikes, reportedAt]
      properties:
        reportId: { type: string }
        truckId: { type: string }
        driver: { type: string, description: 마스킹된 표시 (예 기사 A) }
        stationId: { type: string }
        actualBikes: { type: integer }
        loaded: { type: [integer, 'null'], description: 이 정류장에서 실은 대수 }
        unloaded: { type: [integer, 'null'], description: 이 정류장에서 내린 대수 }
        issue: { type: [string, 'null'], enum: [BLOCKED, CONSTRUCTION, INVENTORY_MISMATCH, OTHER, null] }
        memo: { type: [string, 'null'] }
        reportedAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      description: 감사 기록 한 줄 (append-only). 사람 이름 대신 역할로 가린 표시만 나간다
      required: [auditId, occurredAt, type, actor, targetId, detail]
      properties:
        auditId: { type: string, examples: [AU-5501] }
        occurredAt: { type: string, format: date-time }
        type:
          type: string
          enum: [APPROVAL_APPROVED, APPROVAL_REJECTED, APPROVAL_REOPENED, FIELD_REPORT, CONSTRAINT_ADDED, PLAN_ACTIVATED, ROUTE_CHANGED]
          description: APPROVAL_REOPENED는 재개 명령을 못 보내 backend가 결정을 되돌린 것
        actor:
          type: object
          required: [role, display]
          properties:
            role: { type: string, enum: [MANAGER, DRIVER, EXECUTIVE, SYSTEM] }
            display: { type: string, examples: [관리자, truck-1 기사] }
        targetId: { type: string, description: approvalId · reportId · constraintId 등 }
        detail: { type: string }

    SolveRequest:
      type: object
      required: [shiftId, kind]
      properties:
        shiftId: { type: string }
        kind:
          type: string
          enum: [PLAN, REPLAN]
        truckIds:
          type: array
          description: REPLAN에서 다시 풀 트럭. 비우면 전체
          items: { type: string }
        excludeStationIds:
          type: array
          items: { type: string }
        requestedBy:
          type: object
          required: [taskId]
          properties:
            taskId: { type: string, format: uuid }

    PlanCandidate:
      type: object
      required: [candidateId, status, plan]
      properties:
        candidateId: { type: string }
        status:
          type: string
          enum: [OK, TIMEOUT_PROVISIONAL]
        plan: { $ref: 'openapi.yaml#/components/schemas/Plan' }
        grade:
          type: [string, 'null']
          enum: [NONE, MINOR, MAJOR, null]
          description: 활성 계획 대비 변경 등급. backend 업무 규칙(PRD 6.6, 기준은 설정으로 조정)으로 계산
        requiredApprovers:
          type: array
          items: { type: string, enum: [MANAGER, DRIVER] }
          description: |
            grade에 따라 backend가 정한 승인 순서. NONE은 `[]`, MINOR는 `[DRIVER]`, MAJOR는 `[MANAGER, DRIVER]`.
            에이전트는 등급으로 승인자를 직접 정하지 않고, 이 순서대로 승인 카드(APPROVAL_REQUIRED)를 보낸다.
        diffs:
          type: array
          items: { $ref: 'openapi.yaml#/components/schemas/RouteDiff' }

    ConstraintType:
      type: string
      enum: [TARGET_ADJUST, STATION_SUSPENDED, STATION_BLOCKED, INVENTORY_OVERRIDE, PRIORITY_BOOST]

    ConstraintRequest:
      allOf:
        - $ref: '#/components/schemas/ApprovedChange'
        - type: object
          required: [shiftId, type, stationIds, validFrom, validTo, reason]
          properties:
            shiftId: { type: string }
            type: { $ref: '#/components/schemas/ConstraintType' }
            stationIds:
              type: array
              minItems: 1
              items: { type: string }
            value:
              type: [integer, 'null']
              description: TARGET_ADJUST 가감 대수, INVENTORY_OVERRIDE 실제 재고
            validFrom: { type: string, format: date-time }
            validTo: { type: string, format: date-time }
            reason: { type: string }

    Constraint:
      allOf:
        - $ref: '#/components/schemas/ConstraintRequest'
        - type: object
          required: [constraintId]
          properties:
            constraintId: { type: string }

    ApprovedChange:
      type: object
      required: [approvalId, taskId]
      properties:
        approvalId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }

    ToolProblem:
      type: object
      description: RFC 9457 + MCP ToolError로 그대로 넘길 정보
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string, description: 모델이 읽고 다시 호출할 수 있는 문장 }
        suggestions:
          type: array
          items: { type: string }
