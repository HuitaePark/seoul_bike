openapi: 3.1.0
info:
  title: 따릉이 재배치 에이전트 · 공개 API
  version: 0.15.0-draft
  summary: 화면(Vue)이 호출하는 backend(Spring Boot) API
  description: |
    **초안 v0.13.** 에이전트·MCP·프론트 담당 확인 전이다. 바뀌면 `info.version`을 올리고 변경 이력을 PR에 남긴다.

    - v0.15: 화면이 더미 없이 실제 자료로 그리도록 (ISS-25). 기사 경로는 `DriverRoute`(경로 + `shiftId`, 현장 보고·구역 대여소 조회에 쓴다). 화면용 계획·기사 경로의 정류장·빠진 대여소에 대여소 이름(`stationName`)을 기준 정보에서 붙인다. 현장 보고가 활성 계획의 그 트럭 정류장 진행(`Stop.status` DONE·SKIPPED)을 남긴다. 무승인 변경 수 `GET /api/shifts/{shiftId}/safety` 추가. (v0.14는 트럭 상태 API, #105)
    - v0.13.2: 현재 재고(`bikes`)는 실시간 수집에 3시간 안의 가장 최근 기사 현장 보고를 반영한다. 보고가 수집보다 늦으면 보고 재고(도착 재고 − 실은 대수 + 내린 대수)와 보고 시각을 쓰고, 재고 불일치(`INVENTORY_MISMATCH`) 보고는 그 뒤 수집에도 차이(도착 재고 − 보고 때 앱 재고)를 더한다.
    - v0.13.1: 트럭 ID는 서울 전체에서 이어 매기는 `TR-NN`(TR-01~TR-35, 합의 30)이다. 계정 발급·승인에서 기사 트럭이 트럭 목록에 없거나 운행하지 않으면 400 `TRUCK_NOT_FOUND`(`suggestions`에 활성 트럭 ID). 예전 `truck-N` 기사 계정은 `TR-0N`으로 옮겼고 다시 로그인해야 한다.
    - v0.13: 현황 지도 `GET /api/regions/{regionId}/stations` 구현 규칙 (어느 대여소가 나오는지, 어느 관측·예측을 쓰는지, 위험 판단 기준). 없는 구역 404 `REGION_NOT_FOUND`, `horizonH` 범위 밖 400.
    - v0.12.1: 응답·SSE의 시각은 모두 서울 오프셋 `+09:00`으로 쓴다 (예 `2026-10-21T07:00:00+09:00`). 형식(RFC 3339)은 그대로다.
    - v0.12: 비활성 계정을 다시 여는 `POST /api/admin/users/{userId}/enable` (승인된 적 있는 계정만, 비활성화 전에 받은 토큰은 다시 열어도 401). `Account.approvedAt` 추가.
    - v0.11.1: 예측 구간 `horizonH` 최대 5 (합의 29).
    - v0.11: 미처리 대여소 사유 `Unserved.reason`을 값 목록으로 (optimizer가 내던 소문자 코드를 대문자로 고정한다).
    - v0.10: 근무조 계획 `GET /api/shifts/{shiftId}/plan`은 관리자·책임자만 (기사는 403, `/api/drivers/me/route`). 기사 경로는 오늘(서울 시각) 근무조만.
    - v0.9: 기사 경로 `GET /api/drivers/me/route`에 404(오늘 경로 없음). SUBMIT_PLAN 카드의 `planId`는 활성화할 계획이다.
    - v0.8: 로그인 실패 제한을 아이디와 접속 IP 묶음으로 센다 (남이 일부러 틀려도 다른 IP에서는 로그인할 수 있다).
    - v0.7: 로그인 실패 제한(429 `TOO_MANY_LOGIN_FAILURES`), 승인 대기 가입 상한(429 `TOO_MANY_PENDING_SIGNUPS`).
    - v0.6: 비활성화한 계정은 이미 받은 토큰도 다음 요청부터 401 (만료를 기다리지 않는다).
    - v0.5: 현장 보고 `POST /api/reports` 규칙(기사만, `issue`가 있으면 재경로 작업). FIELD_REPORT 작업은 작업 API로 만들지 않는다 (G13).
    - v0.4: `TaskEvent.code`(FAILED 실패 종류). SSE는 계약 필드만 보낸다.
    - v0.3: 경로 변경 승인 카드에 `candidateId`·`requiredApprovers`. 큰 변경(MAJOR)은 관리자 → 기사 카드 두 장.
    - v0.2: 회원가입(`/api/auth/signup`, 승인 대기)과 관리자 계정 관리(`/api/admin/users`) 추가.

    - 작업 API 5개는 과제 레퍼런스(표 5-8)를 그대로 따른다. 경로와 이름을 바꾸지 않는다.
    - LLM이 필요한 요청은 작업으로 접수해 **202**를 돌려주고, 진행 상황은 **SSE**로 보낸다.
    - 화면은 이 API만 호출한다. AI 서버 주소는 화면에 드러내지 않는다.
    - 오류 본문은 RFC 9457 `application/problem+json`이다.
    - 모든 `date-time` 값은 RFC 3339이고 backend가 내보낼 때는 서울 오프셋 `+09:00`을 붙인다 (예 `2026-10-21T07:00:00+09:00`, 팀 합의 5). 요청에는 어느 오프셋이든 받는다.
servers:
  - url: https://baki-macbookpro.tail3286a4.ts.net
    description: 배포 서버 (Tailscale Funnel)
  - url: http://localhost:8080
    description: 로컬
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 로그인과 내 정보
  - name: ai-tasks
    description: 작업 API (과제 레퍼런스 표 5-8)
  - name: stations
    description: 대여소 현황
  - name: plans
    description: 계획과 기사 경로
  - name: reports
    description: 기사 현장 보고
  - name: kpi
    description: 성과 비교
  - name: system
    description: 배포·통합 확인
  - name: accounts
    description: 계정 관리 (관리자 = MANAGER)

paths:
  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 로그인하고 액세스 토큰을 받는다
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "승인 대기(ACCOUNT_PENDING) 또는 비활성(ACCOUNT_DISABLED) 계정"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            같은 아이디를 같은 접속 IP에서 여러 번(기본 10번) 틀려 잠시 막힘 (TOO_MANY_LOGIN_FAILURES).
            첫 시도부터 기본 10분이 지나야 풀리며, 그동안 그 IP에서는 맞는 비밀번호도 받지 않는다. 다른 IP는 영향이 없다.
            없는 아이디도 똑같이 센다.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: 회원가입 신청
      description: |
        누구나 신청할 수 있고, 계정은 **승인 대기(PENDING)** 로 만들어진다.
        관리자가 승인(역할·트럭 확정)하기 전에는 로그인할 수 없다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: 신청 접수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 이미 쓰는 아이디 (LOGIN_ID_TAKEN)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: 승인 대기 가입 신청이 너무 많이(기본 50건) 쌓여 받지 않음 (TOO_MANY_PENDING_SIGNUPS). 관리자가 처리하면 다시 받는다
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: 내 정보
      responses:
        '200':
          description: 로그인한 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/ai/tasks:
    post:
      operationId: createTask
      tags: [ai-tasks]
      summary: 질문·요청으로 작업을 만든다
      description: |
        작업 상태를 저장하고 Kafka `ai.tasks`로 에이전트에 넘긴 뒤 바로 202를 돌려준다.
        같은 근무조(`shiftId`)의 작업은 순서대로 처리된다.
        **FIELD_REPORT는 `POST /api/reports`로만 만든다.** 이 API로 보내면 400 `USE_REPORTS_API`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '202':
          description: 작업 접수
          headers:
            Location:
              schema: { type: string }
              description: /api/ai/tasks/{taskId}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      operationId: listTasks
      tags: [ai-tasks]
      summary: 작업 목록
      parameters:
        - name: mine
          in: query
          description: true면 내가 만든 작업만
          schema: { type: boolean, default: false }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: shiftId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 최신순 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/ai/tasks/{taskId}:
    get:
      operationId: getTask
      tags: [ai-tasks]
      summary: 작업 상태와 결과
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/ai/tasks/{taskId}/stream:
    get:
      operationId: streamTaskEvents
      tags: [ai-tasks]
      summary: 진행 이벤트 구독 (SSE)
      description: |
        `text/event-stream`. 각 이벤트는 `id`(작업 안에서 증가하는 seq), `event`(아래 `TaskEventType`),
        `data`(JSON, 스키마 `TaskEvent`)로 보낸다.

        - 재연결할 때 `Last-Event-ID`를 보내면 그 다음 이벤트부터 다시 보낸다. 이벤트는 DB에 남아 있다.
        - 15초마다 주석 줄(`: ping`)을 보낸다. 프록시가 연결을 끊지 않게 하기 위해서다.
        - `DONE` 또는 `FAILED`를 보낸 뒤 스트림을 닫는다.

        | event | 언제 | 화면 |
        | --- | --- | --- |
        | TOKEN | 답변이 생성되는 동안 | 답변 영역에 이어 붙임 |
        | TOOL_START · TOOL_END | MCP 도구 실행 전후 | "대여소 조회 중…" 상태 |
        | APPROVAL_REQUIRED | 변경 도구 앞에서 멈췄을 때 | 승인 카드 |
        | DONE · FAILED | 작업 종료 | 스트림 닫고 목록 갱신 |
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 이벤트 스트림
          content:
            text/event-stream:
              schema:
                type: string
                examples:
                  - "id: 7\nevent: APPROVAL_REQUIRED\ndata: {\"taskId\":\"...\",\"seq\":7,\"type\":\"APPROVAL_REQUIRED\",...}\n\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/ai/tasks/{taskId}/approval:
    post:
      operationId: decideApproval
      tags: [ai-tasks]
      summary: 승인 또는 거절
      description: |
        `APPROVAL_REQUIRED` 이벤트의 `approvalId`에 답한다. 승인 주체가 아니면 403.
        계획은 관리자, 작은 변경(minor)은 해당 트럭 기사, 큰 변경(major)은 관리자가 먼저 승인한다.
        backend가 승인 기록을 남긴 뒤 같은 `threadId`로 에이전트를 재개한다.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '202':
          description: 결정 접수. 결과는 SSE로 온다
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 처리됐거나 더 새로운 변경안으로 대체됨(superseded)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/admin/users:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: 계정 목록 (관리자)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
      responses:
        '200':
          description: 최신 가입순
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAccount
      tags: [accounts]
      summary: 계정 발급 (관리자)
      description: 바로 쓸 수 있는(ACTIVE) 계정을 만든다. 기사는 트럭이 필요하다 (TRUCK_REQUIRED). 트럭은 트럭 목록의 운행 중인 트럭이어야 한다 (TRUCK_NOT_FOUND).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400':
          description: |
            요청 형식 오류, 기사인데 트럭 없음(TRUCK_REQUIRED), 또는 트럭 목록에 없거나 운행하지 않는 트럭(TRUCK_NOT_FOUND).
            TRUCK_NOT_FOUND면 `suggestions`에 고를 수 있는 활성 트럭 ID가 번호 순으로 있다 (예 TR-01 … TR-35).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 이미 쓰는 아이디 (LOGIN_ID_TAKEN)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/admin/users/{userId}/approve:
    post:
      operationId: approveAccount
      tags: [accounts]
      summary: 가입 신청 승인 (관리자)
      description: 역할과 트럭을 확정하고 ACTIVE로 바꾼다. 기사로 승인하려면 truckId가 필요하고 (TRUCK_REQUIRED), 트럭 목록의 운행 중인 트럭이어야 한다 (TRUCK_NOT_FOUND). 승인 대기가 아닌 계정은 트럭을 보지 않고 409다.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveAccountRequest' }
      responses:
        '200':
          description: 승인됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400':
          description: |
            요청 형식 오류, 기사인데 트럭 없음(TRUCK_REQUIRED), 또는 트럭 목록에 없거나 운행하지 않는 트럭(TRUCK_NOT_FOUND).
            TRUCK_NOT_FOUND면 `suggestions`에 고를 수 있는 활성 트럭 ID가 번호 순으로 있다 (예 TR-01 … TR-35).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 승인 대기 상태가 아님 (ACCOUNT_NOT_PENDING)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/admin/users/{userId}/disable:
    post:
      operationId: disableAccount
      tags: [accounts]
      summary: 계정 비활성화 (관리자)
      description: |
        로그인을 막는다. 가입 신청 거절에도 쓴다. 자기 계정은 비활성화할 수 없다 (CANNOT_DISABLE_SELF).
        이미 발급된 토큰도 다음 요청부터 401이다. 이미 열린 SSE 연결은 바로 끊지 않고, 다시 연결할 때 401이다.
        승인된 적 있는 계정은 `POST /api/admin/users/{userId}/enable`로 다시 열 수 있다. 거절한 가입 신청은 다시 열 수 없다.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 비활성화됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/users/{userId}/enable:
    post:
      operationId: enableAccount
      tags: [accounts]
      summary: 계정 다시 활성화 (관리자)
      description: |
        비활성(DISABLED) 계정을 ACTIVE로 되돌려 다시 로그인할 수 있게 한다. 역할·트럭은 비활성화 전 그대로다.
        **승인된 적 있는 계정(`approvedAt`이 있음)만** 연다. 거절한 가입 신청도 DISABLED로 남는데, 이것을 열면 신청 때 고른 역할로
        승인 단계 없이 ACTIVE가 되므로 막는다 (SIGNUP_REJECTED). 다시 가입을 받거나 새로 발급한다.
        **비활성화 전에 받은 토큰은 다시 연 뒤에도 401이다.** 새로 로그인해야 한다.
        기사는 트럭 목록에 있는 운행 트럭을 가져야 다시 연다 (아니면 400 `TRUCK_NOT_FOUND`, `suggestions`에 운행 트럭 ID).
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 다시 활성화됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400':
          description: 기사의 트럭이 트럭 목록에 없거나 운행하지 않음 (TRUCK_NOT_FOUND)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 비활성 상태가 아님 (ACCOUNT_NOT_DISABLED) 또는 거절한 가입 신청 (SIGNUP_REJECTED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/regions/{regionId}/stations:
    get:
      operationId: listRegionStations
      tags: [stations]
      summary: 권역 대여소 현황과 예측 (현황 지도)
      description: |
        로그인한 모든 역할(관리자·기사·책임자)이 본다. 운영 중인 대여소 가운데 실시간 재고 관측이 하나라도 있는 것만 대여소 ID 순으로 준다.
        관측이 없는 대여소는 빠진다 (위험을 판단할 재고가 없다). 관측이 하나도 없는 구역은 빈 목록이다.
        `bikes`는 실시간 수집에 3시간 안의 가장 최근 기사 현장 보고를 반영한 재고다 (`StationStatus.bikes`). `docks`는 가장 최근 실시간 수집 값이다.
        예측은 `horizonH`가 같고 **아직 끝나지 않은 구간**(시작 + `horizonH`시간 > 지금) 중 시작이 가장 이른 것을 쓴다:
        진행 중인 근무조의 예측이 있으면 그것, 없으면 다음 근무조 예측(시작 30분 전에 들어온다). 지난 근무조 예측은 쓰지 않는다.
        고를 예측이 없으면 `forecastBikes`는 null이고 위험은 현재 재고로만 판단한다. 판단 기준은 `RiskKind`.
      parameters:
        - name: regionId
          in: path
          required: true
          schema: { type: string, examples: [N02] }
        - name: horizonH
          in: query
          description: 예측 구간(시간)
          schema: { type: integer, minimum: 1, maximum: 5, default: 3 }
      responses:
        '200':
          description: 대여소 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StationStatus' }
        '400':
          description: '`horizonH`가 1~5 밖 (INVALID_REQUEST)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없는 구역 (REGION_NOT_FOUND). `suggestions`에 구역 ID 17개
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/shifts/{shiftId}/plan:
    get:
      operationId: getShiftPlan
      tags: [plans]
      summary: 근무조의 현재 계획 (계획 검토·모니터링)
      description: |
        관리자·책임자만. 모든 트럭 경로가 들어 있어 기사는 403이다 (기사는 `/api/drivers/me/route`).
        정류장·빠진 대여소의 이름(`stationName`)은 기준 정보에서 붙인다 (경로 계산은 대여소 ID만 넣는다).
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: 가장 최근 버전의 계획 (상태와 상관없이. 승인을 기다리는 후보일 수 있다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/shifts/{shiftId}/safety:
    get:
      operationId: getShiftSafety
      tags: [plans]
      summary: 근무조의 무승인 변경 수 (PRD 9.2, 반드시 0)
      description: |
        관리자·책임자만 (계획과 같은 범위). 근무조에서 ACTIVE가 된 적 있는 계획 버전을 센다.
        활성화한 승인(`activated_by_approval`)이 APPROVED면 승인된 변경, 승인이 없거나 APPROVED가 아니면 무승인 변경이다.
        계획 활성화와 경로 적용(새 버전)이 변경이다. 현장 보고로 남기는 정류장 진행은 경로를 바꾸지 않아 세지 않는다.
        계획이 없는 근무조는 둘 다 0이다.
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: 승인·무승인 변경 수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftSafety' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/drivers/me/route:
    get:
      operationId: getMyRoute
      tags: [plans]
      summary: 기사 본인 트럭의 오늘 경로
      description: |
        DRIVER만. 다른 트럭 경로는 볼 수 없다 (트럭은 토큰에서 꺼낸다).
        오늘(Asia/Seoul) 날짜 근무조(`shiftId`의 `yyyy-MM-dd`)의 ACTIVE 계획 중 이 트럭이 있고 가장 늦게 활성화된 것의 경로다.
        지난 근무조의 경로는 나오지 않는다. 없으면 404.
        그 경로의 근무조(`shiftId`)를 같이 준다. 기사 계정에는 근무조가 없어 화면이 현장 보고와 구역 대여소 조회(구역 ID는 `shiftId` 앞부분)에 쓴다.
        정류장 이름(`stationName`)은 기준 정보에서 붙인다 (경로 계산은 대여소 ID만 넣는다).
      responses:
        '200':
          description: 경로
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 오늘 경로가 없다 (NOT_FOUND)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/reports:
    post:
      operationId: createFieldReport
      tags: [reports]
      summary: 정류장 현장 보고
      description: |
        **DRIVER만** 보고한다. 트럭은 로그인한 기사의 트럭이다 (본문에 받지 않는다).
        보고는 바로 저장하고, **`issue`가 있으면** 재경로 `FIELD_REPORT` 작업을 만들어 `taskId`를 함께 돌려준다.
        `issue`가 없는 보고(진행 기록)는 저장만 하고 `taskId`는 null이다.
        **정류장 진행:** 그 근무조 ACTIVE 계획의 이 트럭 경로에서 이 대여소의 첫 PENDING 정류장을 끝낸다. 진입 불가·공사(`BLOCKED`·`CONSTRUCTION`)는
        `SKIPPED`, 그 밖은 `DONE`이다. `DONE`이고 `loaded`·`unloaded`가 있으면 그 정류장 `loadAfter`를 직전에 끝낸 정류장의 적재(없으면 `startLoad`)
        \+ 실은 대수 − 내린 대수로 다시 센다. 트럭 상태와 재경로는 마지막으로 끝낸 정류장에서 시작한다. 진행은 새 버전을 만들지 않는다.
        경로에 없거나 이미 끝낸 정류장의 보고는 저장만 한다 (진행은 그대로). 재경로 작업이 있으면 진행을 먼저 남긴다.
        작업 명령(`ai.tasks`)에는 보고 값(`report`)을 같이 실어 agent가 다시 읽지 않게 한다.
        정류장이 그 기사의 경로에 있는지는 경로가 생기면(M3) 확인한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldReportRequest' }
      responses:
        '202':
          description: 보고 저장, 재경로 작업 접수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldReportAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: |
            작업 큐에 넣지 못함 (QUEUE_UNAVAILABLE). 보고도 남기지 않으니 다시 보낸다.
            전송 시간 초과 뒤 명령이 늦게 도착할 수 있어, 드물게 재경로 작업이 한 번 더 생길 수 있다.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/kpi:
    get:
      operationId: getKpi
      tags: [kpi]
      summary: 정책별 성과 비교 (시뮬레이터 결과)
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: regionId
          in: query
          required: true
          schema: { type: string }
        - name: policies
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/Policy' }
      responses:
        '200':
          description: 정책별 지표
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicyKpi' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/system/status:
    get:
      operationId: getSystemStatus
      tags: [system]
      summary: 시스템 상태 (구현됨)
      description: backend가 PostgreSQL과 Kafka에 실제로 연결되는지. 인증 없음.
      security: []
      responses:
        '200':
          description: 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        역할 클레임: MANAGER, DRIVER, EXECUTIVE. DRIVER 토큰에는 truckId가 들어간다.
        계정이 ACTIVE가 아니면(비활성화 등) 토큰이 만료 전이어도 다음 요청부터 401 `UNAUTHORIZED`다.

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    ShiftId:
      name: shiftId
      in: path
      required: true
      description: "{regionId}:{yyyy-MM-dd}:{AM|PM|EVE}. Kafka 메시지 키로도 쓴다"
      schema: { type: string, examples: ['N02:2026-11-03:AM'] }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: 요청 형식 오류
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: 토큰 없음, 만료, 또는 계정이 활성 상태가 아님(비활성화 등)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 역할 또는 소유권 부족 (예 다른 트럭)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Role:
      type: string
      enum: [MANAGER, DRIVER, EXECUTIVE]

    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: 초 }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        truckId:
          type: [string, 'null']
          description: DRIVER만. 트럭 ID `TR-NN` (합의 30)
          examples: [TR-01]

    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, DISABLED]
      description: PENDING 가입 신청(로그인 불가) · ACTIVE 사용 중 · DISABLED 비활성(로그인 불가)

    LoginId:
      type: string
      minLength: 4
      maxLength: 32
      pattern: '^[a-z0-9._-]+$'
      description: 영문 소문자·숫자·. _ -

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72

    Account:
      type: object
      required: [id, loginId, name, role, status, createdAt]
      properties:
        id: { type: string }
        loginId: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        truckId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/AccountStatus' }
        createdAt: { type: string, format: date-time }
        approvedAt:
          type: [string, 'null']
          format: date-time
          description: 승인(또는 관리자 발급)된 시각. 없으면 승인된 적 없는 계정(승인 대기, 거절한 가입 신청)이다

    SignupRequest:
      type: object
      required: [loginId, password, name, requestedRole]
      properties:
        loginId: { $ref: '#/components/schemas/LoginId' }
        password: { $ref: '#/components/schemas/Password' }
        name: { type: string, minLength: 1, maxLength: 50 }
        requestedRole:
          $ref: '#/components/schemas/Role'
          description: 희망 역할. 관리자가 승인할 때 바꿀 수 있다

    CreateAccountRequest:
      type: object
      required: [loginId, password, name, role]
      properties:
        loginId: { $ref: '#/components/schemas/LoginId' }
        password: { $ref: '#/components/schemas/Password' }
        name: { type: string, minLength: 1, maxLength: 50 }
        role: { $ref: '#/components/schemas/Role' }
        truckId:
          type: [string, 'null']
          maxLength: 64
          description: DRIVER면 필수. 트럭 목록의 운행 중인 트럭 ID `TR-NN` (합의 30). 다른 역할이면 버린다
          examples: [TR-01]

    ApproveAccountRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        truckId:
          type: [string, 'null']
          maxLength: 64
          description: DRIVER면 필수. 트럭 목록의 운행 중인 트럭 ID `TR-NN` (합의 30). 다른 역할이면 버린다
          examples: [TR-01]

    TaskType:
      type: string
      enum: [PLAN_DRAFT, FIELD_REPORT, REQUEST, QUESTION]
      description: |
        PLAN_DRAFT 근무조 계획 초안 · FIELD_REPORT 현장 보고 해석·재경로 ·
        REQUEST 상황 반영 요청(행사·공사) · QUESTION 질의응답

    TaskStatus:
      type: string
      enum: [QUEUED, RUNNING, WAITING_APPROVAL, DONE, FAILED]

    CreateTaskRequest:
      type: object
      required: [type, shiftId]
      properties:
        type: { $ref: '#/components/schemas/TaskType' }
        shiftId: { type: string }
        text:
          type: string
          maxLength: 2000
          description: REQUEST·QUESTION의 자연어 입력. FIELD_REPORT는 이 API로 만들지 않는다 (`POST /api/reports`)

    TaskAccepted:
      type: object
      required: [taskId, status, streamUrl]
      properties:
        taskId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TaskStatus' }
        streamUrl: { type: string, examples: ['/api/ai/tasks/0c3e…/stream'] }

    Task:
      type: object
      required: [taskId, type, status, shiftId, createdBy, createdAt, updatedAt]
      properties:
        taskId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TaskType' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        shiftId: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        answer:
          type: [string, 'null']
          description: DONE일 때 최종 답변
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        pendingApproval:
          oneOf:
            - $ref: '#/components/schemas/ApprovalRequest'
            - type: 'null'
        error:
          type: [string, 'null']
          description: FAILED 사유
        traceId:
          type: [string, 'null']
          description: LangSmith trace (Harness 관측)

    TaskPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    TaskEventType:
      type: string
      enum: [TOKEN, TOOL_START, TOOL_END, APPROVAL_REQUIRED, DONE, FAILED]

    TaskEvent:
      type: object
      description: |
        SSE data. Kafka ai.events 메시지와 같은 형식 (asyncapi.yaml). backend는 아래 계약 필드만 보낸다.
      required: [taskId, seq, type, occurredAt]
      properties:
        taskId: { type: string, format: uuid }
        seq: { type: integer, description: SSE id와 같다 }
        type: { $ref: '#/components/schemas/TaskEventType' }
        occurredAt: { type: string, format: date-time }
        token:
          type: string
          description: TOKEN
        tool:
          type: object
          description: TOOL_START · TOOL_END
          properties:
            name: { type: string, examples: [business_get_risk_stations] }
            label: { type: string, examples: [위험 대여소 조회 중] }
            ok: { type: boolean, description: TOOL_END만 }
        approval:
          $ref: '#/components/schemas/ApprovalRequest'
        answer:
          type: string
          description: DONE
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        error:
          type: string
          description: FAILED
        code:
          type: [string, 'null']
          description: FAILED만. 실패 종류 (예 LOOP_TIMEOUT, OUTPUT_INVALID). 화면 분기용이고 값 목록은 agent가 정한다

    ApprovalRequest:
      type: object
      description: |
        변경 도구 앞에서 에이전트가 멈췄을 때의 승인 카드. 승인하면 그 변경을 받아들인 것이다.
        경로 변경은 **이 카드의 승인이 곧 기사 수락**이다. 따로 수락 단계를 두지 않는다 (FR-13).
      required: [approvalId, kind, approver, summary]
      properties:
        approvalId: { type: string, format: uuid }
        kind:
          type: string
          enum: [SUBMIT_PLAN, ADD_CONSTRAINT, ROUTE_CHANGE]
        approver:
          type: string
          enum: [MANAGER, DRIVER]
          description: |
            이 카드를 결정할 사람. SUBMIT_PLAN·ADD_CONSTRAINT는 MANAGER.
            ROUTE_CHANGE는 후보의 `requiredApprovers` 순서를 따른다. MINOR는 그 트럭 기사(DRIVER) 카드 한 장,
            MAJOR는 관리자(MANAGER) 카드가 승인된 뒤 같은 작업에서 기사 카드를 한 장 더 보낸다.
        grade:
          type: [string, 'null']
          enum: [MINOR, MAJOR, null]
          description: ROUTE_CHANGE만. backend가 계산한 변경 등급 (PRD 6.6)
        candidateId:
          type: [string, 'null']
          description: ROUTE_CHANGE만. 어떤 후보 경로에 대한 카드인지. MAJOR의 두 카드는 같은 값을 쓴다
        requiredApprovers:
          type: array
          items: { type: string, enum: [MANAGER, DRIVER] }
          description: ROUTE_CHANGE만. 이 후보에 필요한 승인 순서. 화면이 "관리자 승인 → 기사 수락" 진행을 보여 줄 때 쓴다
        truckId: { type: [string, 'null'] }
        summary: { type: string, description: 승인 카드 제목 }
        reasons:
          type: array
          items: { type: string }
        planId:
          type: [string, 'null']
          description: SUBMIT_PLAN만. 활성화할 계획. 없거나 다른 계획이면 활성화 API가 403으로 막는다
        diff:
          oneOf:
            - $ref: '#/components/schemas/RouteDiff'
            - type: 'null'

    ApprovalDecision:
      type: object
      required: [approvalId, decision]
      properties:
        approvalId: { type: string, format: uuid }
        decision:
          type: string
          enum: [APPROVE, REJECT]
        excludeStationIds:
          type: array
          description: 계획 승인에서 일부 대여소를 빼고 다시 계산 (UR-04)
          items: { type: string }
        comment: { type: string, maxLength: 500 }

    Source:
      type: object
      description: 근거. 도구 결과 또는 RAG 문서
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [TOOL, DOC]
        title: { type: string }
        uri:
          type: [string, 'null']
          description: "DOC이면 doc://{docId} (rag-mcp Resource)"
        excerpt: { type: [string, 'null'] }

    StationRole:
      type: string
      enum: [FIXED_PICKUP, FIXED_DROPOFF, VARIABLE]

    RiskKind:
      type: string
      enum: [EMPTY, OVERFLOW, NONE]
      description: |
        재고 궤적으로 판단한다. 궤적은 관측 시각의 재고에서 시작해, 예측 구간 가운데 **관측 시각 뒤에 남은 부분**의 순유입(반납 − 대여)만
        더한 점들이다 (구간이 진행 중이면 지난 몫은 이미 관측 재고에 들어 있다). 시간별 예측이 있으면 매시 경계(구간 시작 + k시간)마다
        점을 만들고 관측 시각이 걸친 시간은 남은 비율만큼만 더한다. 시간별 예측이 없으면 합계가 고르게 퍼진다고 보고 남은 비율만큼 더한
        구간 끝 한 점. 각 점은 반올림한 대수. 예측이 없으면 현재 재고 한 점.
        `EMPTY`: 한 점이라도 **2대 이하** (빈 위험, 합의 27). `OVERFLOW`: EMPTY가 아니고 한 점이라도 **거치대 수를 넘음**
        (운영 상한 초기값 = 거치대 수, PRD 7.1). `NONE`: 둘 다 아님.

    StationStatus:
      type: object
      required: [stationId, name, lat, lon, docks, bikes, observedAt, risk]
      properties:
        stationId: { type: string }
        name: { type: string }
        lat: { type: number }
        lon: { type: number }
        docks: { type: integer, description: 거치대 수 (가장 최근 실시간 수집) }
        bikes:
          type: integer
          description: |
            현재 재고. 실시간 수집에 3시간 안의 가장 최근 기사 현장 보고를 반영한다:
            보고가 수집보다 늦으면 보고 재고(도착 재고 − 실은 대수 + 내린 대수).
            재고 불일치(`INVENTORY_MISMATCH`) 보고 뒤에 수집이 왔으면 최근 수집 + (도착 재고 − 보고 때 앱 재고). 앱 숫자가 틀렸다는 보고라 다음 수집이 덮지 않는다.
            그 밖에는 최근 수집 값. 0 밑으로 내려가지 않는다 (거치대보다 많을 수는 있다)
        observedAt: { type: string, format: date-time, description: '그 재고의 시각 (보고가 수집보다 늦으면 보고 시각, 아니면 최근 수집 시각)' }
        forecastBikes:
          type: [integer, 'null']
          description: 예측 구간 끝의 예상 재고 = 재고 궤적의 끝 점 (0 밑으로 내려가지 않는다). 고를 예측이 없으면 null
        risk: { $ref: '#/components/schemas/RiskKind' }
        role: { $ref: '#/components/schemas/StationRole' }
        elevationM: { type: [number, 'null'] }

    Stop:
      type: object
      required: [seq, stationId, action, bikes]
      properties:
        seq: { type: integer }
        stationId: { type: string }
        stationName: { type: string }
        action:
          type: string
          enum: [PICKUP, DROPOFF]
        bikes: { type: integer, minimum: 1 }
        loadAfter: { type: integer }
        eta: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'], description: 포함 근거 (FR-03) }
        status:
          type: string
          enum: [PENDING, DONE, SKIPPED]

    DriverRoute:
      description: 기사 본인 경로. `Route`에 그 경로가 속한 근무조를 더한다
      allOf:
        - $ref: '#/components/schemas/Route'
        - type: object
          required: [shiftId]
          properties:
            shiftId: { type: string, description: '이 경로가 속한 근무조 ID (현장 보고 `shiftId`, 구역 ID는 앞부분)' }

    ShiftSafety:
      type: object
      required: [shiftId, approvedChanges, unapprovedChanges]
      properties:
        shiftId: { type: string }
        approvedChanges: { type: integer, description: 승인으로 ACTIVE가 된 계획 버전 수 (계획 활성화 + 경로 적용) }
        unapprovedChanges: { type: integer, description: '승인 없이 ACTIVE가 된 계획 버전 수. 반드시 0 (PRD 9.2)' }

    Route:
      type: object
      required: [truckId, stops]
      properties:
        truckId: { type: string }
        capacity: { type: integer, examples: [15] }
        startLoad: { type: integer }
        stops:
          type: array
          items: { $ref: '#/components/schemas/Stop' }

    Unserved:
      type: object
      description: 포기한 대여소와 이유 (FR-05)
      required: [stationId, priority, reason]
      properties:
        stationId: { type: string }
        stationName: { type: string }
        priority: { type: number }
        reason:
          type: string
          description: |
            화면은 이 값을 문장으로 바꿔 보여 준다.
            BLOCKED: 방문하지 않기로 한 대여소 (관리자 제외·현장 차단) / NO_TRUCKS: 쓸 수 있는 트럭이 없음 /
            CAPACITY_EXCEEDED: 트럭 용량보다 큰 작업 / NOT_SELECTED: 시간·적재량 안에서 우선순위에 밀림 (원인을 하나로 단정하지 않는다) /
            NO_SOLUTION: 해를 찾지 못함
          enum: [BLOCKED, NO_TRUCKS, CAPACITY_EXCEEDED, NOT_SELECTED, NO_SOLUTION]

    Plan:
      type: object
      required: [planId, shiftId, version, status, routes, unserved]
      properties:
        planId: { type: string }
        shiftId: { type: string }
        version: { type: integer }
        status:
          type: string
          enum: [DRAFT, PROPOSED, ACTIVE, REJECTED, CLOSED]
        provisional:
          type: boolean
          description: 최적화 시간 초과로 만든 임시안
        routes:
          type: array
          items: { $ref: '#/components/schemas/Route' }
        unserved:
          type: array
          items: { $ref: '#/components/schemas/Unserved' }
        explanation: { type: [string, 'null'] }

    RouteDiff:
      type: object
      required: [truckId, before, after]
      properties:
        truckId: { type: string }
        before:
          type: array
          items: { $ref: '#/components/schemas/Stop' }
        after:
          type: array
          items: { $ref: '#/components/schemas/Stop' }
        addedMinutes: { type: number }

    FieldReportRequest:
      type: object
      required: [shiftId, stationId, actualBikes]
      properties:
        shiftId: { type: string, minLength: 1, maxLength: 100 }
        stationId: { type: string, minLength: 1, maxLength: 64 }
        actualBikes: { type: integer, minimum: 0, description: 도착했을 때 실제 재고 }
        loaded: { type: [integer, 'null'], minimum: 0 }
        unloaded: { type: [integer, 'null'], minimum: 0 }
        issue:
          type: [string, 'null']
          enum: [BLOCKED, CONSTRUCTION, INVENTORY_MISMATCH, OTHER, null]
        memo: { type: [string, 'null'], maxLength: 500 }

    FieldReportAccepted:
      type: object
      required: [reportId]
      properties:
        reportId: { type: string }
        taskId:
          type: [string, 'null']
          format: uuid
          description: 재경로 작업을 만들었으면 그 id

    Policy:
      type: string
      enum: [NONE, GREEDY, CURRENT_OPS, AGENT]
      description: 재배치 없음 · 단순 규칙 · 현행 운영 재현 · 본 시스템

    PolicyKpi:
      type: object
      required: [policy, emptyStationMinutes, overflowStationMinutes, bikesMovedPerTruckHour]
      properties:
        policy: { $ref: '#/components/schemas/Policy' }
        emptyStationMinutes: { type: number, description: 주 지표 }
        overflowStationMinutes: { type: number }
        bikesMovedPerTruckHour: { type: number }

    SystemStatus:
      type: object
      required: [service, version, revision, serverTime, dependencies]
      properties:
        service: { type: string }
        version: { type: string }
        revision: { type: string }
        builtAt: { type: [string, 'null'], format: date-time }
        serverTime: { type: string, format: date-time }
        dependencies:
          type: array
          items:
            type: object
            required: [name, status, detail]
            properties:
              name: { type: string }
              status:
                type: string
                enum: [UP, DOWN]
              detail: { type: string }

    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: 화면 분기용 코드 (예 APPROVAL_SUPERSEDED, TRUCK_NOT_OWNED)
        suggestions:
          type: array
          items: { type: string }
          description: 다시 요청할 때 쓸 수 있는 후보 ID (예 REGION_NOT_FOUND면 구역 ID). 줄 후보가 있을 때만 있다
