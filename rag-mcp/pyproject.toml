[project]
name = "rag-mcp"
version = "0.1.0"
description = "근거 문서 검색 서버 (FastMCP). search_docs 도구와 doc:// Resource를 제공하고 업무 데이터는 바꾸지 않는다."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
rag-mcp = "rag_mcp.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]
