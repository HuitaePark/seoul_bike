[project]
name = "rag-mcp"
version = "0.2.0"
description = "근거 문서 검색 서버(FastMCP)와 색인기(rag-indexer). search_docs 도구와 doc:// Resource를 제공하고 업무 데이터는 바꾸지 않는다."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "pyyaml>=6",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "fastembed>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
rag-mcp = "rag_mcp.__main__:main"
rag-indexer = "rag_mcp.indexer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "pgvector: 실제 pgvector가 필요하다 (RAG_TEST_DSN 환경 변수가 있을 때만 실행)",
    "fastembed: 실제 임베딩 모델을 받는다 (RAG_TEST_FASTEMBED=1일 때만 실행)",
]
