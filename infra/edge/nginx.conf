# 서버 포트를 잡고 있는 앞단 (무중단 배포, infra/deploy.sh). frontend·backend는 배포 때 새 컨테이너가 healthy가 된 뒤
# 옛 컨테이너를 내리는데(순차 교체), 그동안 둘이 같이 떠 있고 IP도 바뀐다. 이 컨테이너는 설정이 바뀔 때만 다시 만든다.
#
# 이름은 요청마다 Docker 내장 DNS로 다시 찾는다 (proxy_pass에 변수, 2초 캐시). 이름이 주소 여럿으로 풀리면 돌아가며 보내고,
# 붙지 못하면 다음 주소로 넘긴다 (proxy_next_upstream 기본값 error timeout). 내린 컨테이너의 IP는 캐시가 남은 동안 응답이 없어
# (연결 거부가 아니라 대기) 연결 대기를 1초로 둔다. 같은 서버 안이라 정상 연결은 1ms도 안 걸린다.
# 연결도 못 한 요청은 POST라도 다음 주소로 넘어간다 (보내기 전이라 두 번 처리되지 않는다).

# 공개 주소: Tailscale Funnel(443·8443) → 127.0.0.1:3000 → 여기 → frontend nginx(화면, /api는 backend로)
server {
    listen 80;
    server_tokens off;
    resolver 127.0.0.11 valid=2s ipv6=off;
    proxy_connect_timeout 1s;
    set $frontend http://frontend:80;

    location = /edge-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE(작업 진행 이벤트)가 지나가므로 버퍼링을 끄고 오래 열어 둔다 (frontend nginx와 같다).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

# 서버 안에서만 쓰는 backend 직접 주소 (127.0.0.1:8080): 화면 개발 서버 프록시(vite), 점검 스크립트, /internal/** 확인.
# 예전에는 backend 컨테이너가 이 포트를 직접 잡았다. 둘이 같이 뜨는 순차 교체를 위해 여기로 옮겼다.
server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=2s ipv6=off;
    proxy_connect_timeout 1s;
    set $backend http://backend:8080;

    location / {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
