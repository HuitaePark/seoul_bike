# 서버(Apple Silicon)와 로컬 개발이 함께 쓰는 Compose 파일.
# 서버 포트는 모두 서버 자신(127.0.0.1)에만 연다. 밖에서는 공개 주소(Tailscale Funnel → 127.0.0.1:3000)로만 들어온다.
# 서버 포트(3000·8080)는 edge가 잡는다. frontend·backend는 포트를 잡지 않아 배포 때 순차 교체할 수 있다 (infra/deploy.sh).
# 아래 인프라는 내부망에만 둔다.
# 비밀값은 저장소가 아니라 서버의 .env에 둔다 (infra/.env.example 참고).
name: seoul-bike

services:
  edge:
    # 서버 포트를 잡는 앞단 (infra/edge/nginx.conf). 화면·API 컨테이너를 바꾸는 동안에도 이 포트는 열려 있다.
    # depends_on을 두지 않는다: 다른 서비스가 바뀌어도 이 컨테이너는 다시 만들지 않는다 (설정·이미지가 바뀔 때만).
    build:
      context: ./edge
    ports:
      # 서버 자신에게만 연다. Tailscale Funnel(443·8443)이 127.0.0.1:3000으로 보낸다. 화면과 /api를 같은 출처로 묶는다.
      # 내부망에서 :3000에 바로 붙으면 X-Forwarded-For를 속일 수 있어(로그인 제한이 접속 IP를 쓴다) 열지 않는다.
      - "127.0.0.1:3000:80"
      # backend 직접 주소. 서버 안에서만 (vite 개발 서버 프록시, 점검). /internal/** 이 내부망에만 남는다.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/edge-health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    # 서버 포트는 edge가 잡는다 (127.0.0.1:3000 → edge → frontend). 배포 때 새 컨테이너가 healthy가 된 뒤 옛 것을 내린다.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      additional_contexts:
        specs: ../docs/specs
        # 구역·대여소 기준 정보 CSV. 6번이 매주 갱신하면 deploy.yml paths가 다시 배포한다.
        refdata: ../analysis/out
      args:
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-seoulbike}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-seoulbike}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 .env에 필요하다}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET이 .env에 필요하다 (32바이트 이상)}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      # 기본은 꺼짐. 진짜 agent 없이 시연할 때만 .env에서 true로 켠다 (켠 채로 agent를 붙이면 이벤트가 두 번 나간다).
      FAKE_AGENT_ENABLED: ${FAKE_AGENT_ENABLED:-false}
      # business-mcp와 같은 값. 비우면 /internal/** 는 모두 401이다.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    # 서버 포트는 edge가 잡는다 (127.0.0.1:8080 → edge → backend). 화면·/api·/swagger는 frontend nginx가 넘겨 준다.
    # 배포 때 새 컨테이너가 healthy가 된 뒤 옛 것을 내린다. 그동안 둘이 같이 돈다 (SseHub·SolveGateway가 DB로 맞춘다).
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      # eclipse-temurin:25-jre 이미지에는 curl·wget이 없다. 패키지를 더 깔지 않고 bash의 /dev/tcp로 health를 읽는다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    # 내릴 때 Spring 그레이스풀 종료(진행 중 요청을 30초까지 마침)가 끝나도록 기본 10초보다 길게 둔다. infra/deploy.sh와 같은 값.
    stop_grace_period: 45s

  agent:
    # 근무조 그래프 (docs/AGENT-GRAPH.md). ai.tasks를 소비해 ai.events를 발행한다. 공개 포트는 없다.
    # 이 서비스가 떠 있으면 backend의 FAKE_AGENT_ENABLED는 false여야 한다 (켜 두면 둘 다 답해 이벤트가 두 번 나간다).
    build:
      context: ../agent
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      # 체크포인터·처리 기록. 업무 DB와 따로 agent 데이터베이스를 쓴다 (agent-db-init이 만든다).
      # 비밀번호는 URL 대신 PGPASSWORD로 준다 (libpq가 읽는다). 특수문자가 있어도 URL 인코딩할 필요가 없다.
      AGENT_PG_URL: postgresql://${POSTGRES_USER:-seoulbike}@postgres:5432/agent
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 .env에 필요하다}
      # 비우면 harness.yaml 모델, none이면 LLM 없는 경로만, ollama:<모델>·openai:<모델>이면 그 모델
      # (서버는 openai:gpt-4.1-mini, 키는 GitHub production 환경 secret → 서버 .env)
      AGENT_LLM: ${AGENT_LLM:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # 1이면 평가용 가짜 MCP (예시 대여소·공지, backend는 바뀌지 않는다). 시연·서버는 0으로 실제 business-mcp·rag-mcp를 쓴다.
      MCP_FAKE: ${MCP_FAKE:-0}
      MCP_BUSINESS_URL: ${MCP_BUSINESS_URL:-http://business-mcp:9101/mcp}
      MCP_RAG_URL: ${MCP_RAG_URL:-http://rag-mcp:9102/mcp}
    depends_on:
      postgres:
        condition: service_healthy
      agent-db-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      # ai.tasks·ai.events(파티션 6개)는 backend가 만든다. agent가 먼저 구독하면 자동 생성된 1파티션 토픽을 보다가 명령을 놓친다.
      backend:
        condition: service_healthy
      # 시작할 때 MCP 도구 목록을 읽는다. 먼저 뜨면 이름을 못 찾아(Name or service not known) 재시작을 되풀이한다
      business-mcp:
        condition: service_healthy
      rag-mcp:
        condition: service_healthy
    healthcheck:
      # MCP 도구를 읽고 Kafka에 붙은 뒤에만 준비 파일이 생기고 10초마다 갱신된다 (graph/worker.py). 크래시 루프면 healthy가 되지 않는다
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/agent-ready') > 30)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  agent-db-init:
    # agent 데이터베이스가 없으면 만들고 끝난다. 이미 있는 pgdata 볼륨에도 돌도록 initdb 스크립트 대신 쓴다.
    image: imresamu/postgis:16-3.4
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-seoulbike}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 .env에 필요하다}
      PGDATABASE: ${POSTGRES_DB:-seoulbike}
    command: ["sh", "-c", "psql -tAc \"select 1 from pg_database where datname = 'agent'\" | grep -q 1 || psql -c 'create database agent'"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # postgis/postgis 공식 이미지는 amd64 전용이라 Apple Silicon에서 에뮬레이션으로 돈다.
    # 같은 메인테이너가 관리하는 멀티 아키텍처 이미지를 쓴다.
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seoulbike}
      POSTGRES_USER: ${POSTGRES_USER:-seoulbike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 .env에 필요하다}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  vectordb:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${VECTOR_DB:-seoulbike_vector}
      POSTGRES_USER: ${VECTOR_USER:-seoulbike}
      POSTGRES_PASSWORD: ${VECTOR_PASSWORD:?VECTOR_PASSWORD가 .env에 필요하다}
    volumes:
      - vectordata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  business-mcp:
    # 재배치 도구 서버 (docs/MCP.md). agent가 http://business-mcp:9101/mcp 로 붙는다. 외부 포트는 열지 않는다.
    build:
      context: ../business-mcp
    environment:
      # backend가 /internal/**를 다 열기 전(M3)까지는 계약 형식의 가짜 응답(fake)으로 돈다.
      # hybrid는 backend가 연 것(현장 보고·제약 추가·감사 기록)만 http로 부른다. 다 열리면 http로 바꾼다.
      INTERNAL_MODE: ${MCP_INTERNAL_MODE:-fake}
      INTERNAL_HTTP_METHODS: ${MCP_INTERNAL_HTTP_METHODS:-}
      BACKEND_URL: http://backend:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9101), 2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rag-indexer:
    # 근거 문서(docs/evidence)를 임베딩해 vectordb(pgvector)에 색인하고 끝난다. 문서·모델이 그대로면 건너뛴다.
    build: &rag-build
      context: ../rag-mcp
      additional_contexts:
        evidence: ../docs/evidence
    image: seoul-bike-rag-mcp:local
    command: ["rag-indexer"]
    environment: &rag-env
      PGHOST: vectordb
      PGDATABASE: ${VECTOR_DB:-seoulbike_vector}
      PGUSER: ${VECTOR_USER:-seoulbike}
      PGPASSWORD: ${VECTOR_PASSWORD:?VECTOR_PASSWORD가 .env에 필요하다}
    depends_on:
      vectordb:
        condition: service_healthy
    restart: "no"

  rag-mcp:
    # 근거 문서 검색 서버 (docs/MCP.md 4절). agent가 http://rag-mcp:9102/mcp 로 붙는다. 임베딩 모델이 메모리 약 1.6GB를 쓴다.
    build: *rag-build
    image: seoul-bike-rag-mcp:local
    command: ["rag-mcp"]
    environment:
      <<: *rag-env
      RAG_STORE: pgvector
    depends_on:
      rag-indexer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9102), 2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  collector:
    # 6번 실시간 재고 수집기를 서버에서 돌린다 (합의 12, analysis/collect/live_db.py). 5분마다 따릉이 재고를
    # live.station_status에 넣고 backend는 읽기만 한다. SEOUL_API_KEY가 비어 있으면 수집하지 않고 기다린다(healthy).
    # 키 넣는 법: infra/README "collector". 공개 포트는 없다.
    build:
      context: ..
      dockerfile: infra/collector/Dockerfile
    environment:
      SEOUL_API_KEY: ${SEOUL_API_KEY:-}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-seoulbike}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 .env에 필요하다}
      PGDATABASE: ${POSTGRES_DB:-seoulbike}
      COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-300}
      COLLECTOR_RETENTION_DAYS: ${COLLECTOR_RETENTION_DAYS:-14}
      # 로그 시각을 서울 시각으로 (수집 시각 자체는 코드가 +09:00으로 정한다)
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      # live.station_status는 backend의 Flyway(V11)가 만든다
      backend:
        condition: service_healthy
    healthcheck:
      # 매 주기(키가 없을 때도) 갱신하는 파일. 15분 넘게 그대로면 수집 루프가 멈춘 것이다
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/collector-alive') > 900)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  optimizer:
    # 경로 최적화 실행기 (역할 5, or-tools/, docs/specs/optimizer.md). solve.requests·solve.requests.retry를 소비해
    # solve.results를 발행하고, 처리 못 한 요청은 solve.requests.dlq로 보낸다. 공개 포트는 없다.
    build:
      context: ..
      dockerfile: or-tools/Dockerfile
    # 이동 시간은 우선 하버사인 추정치다. 도로 기준 OSRM은 서울 도로 데이터 전처리·서버 메모리가 정해지면
    # --travel-source osrm --osrm-url --osrm-data-version --matrix-cache-dir 로 바꾼다 (infra/optimizer/README.md).
    # group-id와 브로커 주소는 상태 볼륨의 identity에 들어간다. 바꾸면 기존 상태로 시작하지 못하므로 고정한다.
    command:
      - python
      - -m
      - rebalancing.worker
      - --bootstrap-servers
      - redpanda:9092
      - --group-id
      - optimizer-v1
      - --state-dir
      - /state
      - --travel-source
      - haversine
    volumes:
      # 결과 중복 방지 기록 (requestId별 저장 결과·발행 여부). 한 worker·유지되는 한 볼륨이 전제다. down -v로 지우지 않는다.
      - optimizer-state:/state
    depends_on:
      redpanda:
        condition: service_healthy
      # solve 토픽 4개(파티션 6개)는 backend가 만든다. worker는 토픽을 자동 생성하지 않으므로 backend 다음에 뜬다.
      backend:
        condition: service_healthy
    healthcheck:
      # worker는 준비 신호를 따로 내지 않는다. 대신 브로커에서 이 소비자 그룹이 STABLE이고 멤버가 있는지 본다.
      # 크래시 루프거나 poll이 멈춰 그룹에서 빠지면(max.poll.interval.ms) healthy가 되지 않는다.
      # AdminClient를 변수에 잡아 둔다. 바로 버리면 응답 전에 정리돼 future가 끝나지 않는다.
      test: ["CMD", "python", "-c", "import sys; from confluent_kafka.admin import AdminClient; a = AdminClient({'bootstrap.servers': 'redpanda:9092'}); g = a.describe_consumer_groups(['optimizer-v1'], request_timeout=5)['optimizer-v1'].result(timeout=8); sys.exit(not (g.state.name == 'STABLE' and g.members))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 3
    # SIGTERM을 받으면 진행 중인 요청을 마치고 멈춘다. 기본 10초보다 여유를 둔다.
    stop_grace_period: 30s
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
  vectordata:
  rpdata:
  optimizer-state:
