# Test-only overlay: use together with compose.dev.yaml. No production volumes.
services:
  vectordb:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mcp_test
      POSTGRES_USER: mcp_test
      POSTGRES_PASSWORD: mcp_test_only
    ports: ["127.0.0.1:${MCP_TEST_PG_PORT:-19432}:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mcp_test -d mcp_test"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 20

  rag-indexer:
    build:
      context: ../..
      dockerfile: infra/mcp/Dockerfile
      args: {MCP_PACKAGE: rag-mcp}
    command: [python, -m, rag_mcp.indexer]
    environment: &vector-env
      PGHOST: vectordb
      PGDATABASE: mcp_test
      PGUSER: mcp_test
      PGPASSWORD: mcp_test_only
      EMBED_PROVIDER: hash
      RAG_DOCS_DIR: /data/docs
    volumes: ["../../docs/evidence:/data/docs:ro"]
    depends_on:
      vectordb:
        condition: service_healthy
    restart: "no"

  rag-mcp:
    environment:
      <<: *vector-env
      RAG_STORE: pgvector
    depends_on:
      rag-indexer:
        condition: service_completed_successfully
