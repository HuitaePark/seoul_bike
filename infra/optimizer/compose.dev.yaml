# Independent local stack. This file is not included by the server deployment.
# OSRM_INPUT_DIR/OSRM_DATA_DIR may point to absolute directories outside the checkout.
name: seoul-bike-optimizer-dev

x-osrm-image: &osrm-image ghcr.io/project-osrm/osrm-backend:v26.10.0-debian@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f

services:
  osrm-prepare:
    image: *osrm-image
    profiles: [prepare]
    entrypoint: [/bin/sh, /scripts/prepare-osrm.sh]
    volumes:
      - ./prepare-osrm.sh:/scripts/prepare-osrm.sh:ro
      - ${OSRM_INPUT_DIR:-./data/input}:/input:ro
      - ${OSRM_DATA_DIR:-./data/processed}:/data

  osrm:
    image: *osrm-image
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        test -s /data/data-version &&
        exec osrm-routed --algorithm ch --threads 2 --max-table-size 100 /data/region.osrm
    ports: ["127.0.0.1:${OSRM_PORT:-5000}:5000"]
    volumes:
      - ${OSRM_DATA_DIR:-./data/processed}:/data:ro
    healthcheck:
      # Port readiness only; validate real routing with the optimizer command.
      test: [CMD, /bin/bash, -c, "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped

  optimizer:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: or-tools/Dockerfile
    depends_on:
      osrm:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        exec python -m rebalancing --osrm-url http://osrm:5000
        --osrm-data-version "$$(cat /data/data-version)"
        --matrix-cache-dir /cache --json
    volumes:
      - ${OSRM_DATA_DIR:-./data/processed}:/data:ro
      - matrix-cache:/cache

volumes:
  matrix-cache:
