plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.seoulbike'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// 보안 패치: Boot 4.1.1(최신 4.1.x)이 관리하는 버전에 알려진 취약점이 있어 같은 계열 패치 버전으로 올린다.
// 다음 Boot 4.1.x가 이 버전 이상을 관리하면 지운다.
ext['tomcat.version'] = '11.0.27'          // CVE-2026-65905, CVE-2026-65182, CVE-2026-68525
ext['jackson-bom.version'] = '3.1.8'       // CVE-2026-89425, CVE-2026-89407, CVE-2026-91777 외
ext['jackson-2-bom.version'] = '2.21.8'    // 테스트 전용(spring-kafka-test의 임베디드 Kafka) 경로, 같은 CVE

springBoot {
	// /api/system/status가 버전과 빌드 시각을 보여주도록 META-INF/build-info.properties를 만든다.
	buildInfo()
}

dependencies {
	constraints {
		// kafka-clients 4.2.1이 끌어오는 lz4-java 1.10.1의 CVE-2026-106451(HIGH) 외 5건. Kafka 4.2.2도 1.11.2라 직접 맞춘다.
		implementation 'at.yawk.lz4:lz4-java:1.11.4'
	}
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.webjars:swagger-ui:5.33.2'
	implementation 'org.webjars:webjars-locator-lite'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-redpanda'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
	// 실행 jar 하나만 만든다. Dockerfile은 backend.jar를 복사한다.
	enabled = false
}

tasks.named('bootJar') {
	archiveFileName = 'backend.jar'
}

// 계약 원본은 docs/specs에 둔다. 빌드할 때 복사해서 /specs/*.yaml로 서빙하고 /swagger/에서 보여준다.
// Docker 빌드는 compose additional_contexts로 넘긴 경로(-PspecsDir=/specs)를 쓴다.
def specsDir = providers.gradleProperty('specsDir').orElse('../docs/specs')
tasks.named('processResources', ProcessResources) {
	from(specsDir.map { file(it) }) {
		include '*.yaml'
		into 'static/specs'
	}
}

tasks.named('test', Test) {
	useJUnitPlatform()
	// 막힌 테스트가 CI를 몇십 분씩 잡지 않게 테스트·@BeforeEach마다 한도를 둔다. 디버거로 멈춘 동안은 재지 않는다.
	systemProperty 'junit.jupiter.execution.timeout.default', '3 m'
	systemProperty 'junit.jupiter.execution.timeout.mode', 'disabled_on_debug'
	testLogging {
		// 기본(SHORT)은 "AssertionError at X.java:104"만 찍어 어느 리스너·이벤트에서 막혔는지 안 보인다.
		events 'failed'
		exceptionFormat 'full'
	}
}
