spring.application.name=backend
server.port=8080
# 화면 nginx와 공개 주소(Tailscale Funnel) 뒤에 있다. X-Forwarded-For·Proto를 읽어 getRemoteAddr()가 실제 접속 IP가 된다.
# 내부망 주소(docker 172.16/12, 127.0.0.1 등)는 믿을 프록시로 보고 건너뛴다. Funnel은 이 헤더를 자기가 본 IP로 덮어쓴다.
server.forward-headers-strategy=native
spring.threads.virtual.enabled=true

# 어떤 소스가 떠 있는지 /api/system/status에 보여준다. Docker 빌드 인자 GIT_SHA에서 온다.
app.revision=${GIT_SHA:local}

# compose가 SPRING_DATASOURCE_* 와 SPRING_KAFKA_BOOTSTRAP_SERVERS로 덮어쓴다. 아래는 로컬 실행 기본값이다.
spring.datasource.url=jdbc:postgresql://localhost:5432/seoulbike
spring.datasource.username=seoulbike
spring.datasource.password=
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.partitions=6
# ai.events 처리 실패: 처음 한 번 + 재시도(ai.events.retry, 같은 간격) 뒤 ai.events.dlq. 형식이 깨진 메시지는 바로 dlq.
app.kafka.retry.attempts=4
app.kafka.retry.delay=2000

# 인증. JWT_SECRET은 32바이트 이상, 서버 .env에만 둔다. SEED_USER_PASSWORD가 있으면 시드 계정을 만든다.
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.token-ttl=12h
app.auth.seed-password=${SEED_USER_PASSWORD:}
# 공개 주소 보호: 같은 아이디를 같은 접속 IP에서 10번 시도하면 첫 시도부터 10분이 지날 때까지 막는다. 승인 대기 가입은 50건까지 받는다.
app.auth.login-max-failures=10
app.auth.login-failure-window=10m
app.auth.max-pending-signups=50

# 진짜 agent가 붙기 전까지 ai.tasks → ai.events를 흉내 낸다.
app.fake-agent.enabled=${FAKE_AGENT_ENABLED:false}

# business-mcp가 /internal/** 를 부를 때 붙이는 서비스 토큰 (X-Internal-Token). 비우면 /internal/** 는 모두 401이다.
app.internal.token=${INTERNAL_TOKEN:}

# 변경 등급 기준 (PRD 6.6, FR-07). 이 안이면 기사만 수락(MINOR), 넘으면 관리자 승인 뒤 기사 수락(MAJOR).
app.route-change.minor-max-dropped-stops=${ROUTE_CHANGE_MINOR_MAX_DROPPED_STOPS:2}
app.route-change.minor-max-added-minutes=${ROUTE_CHANGE_MINOR_MAX_ADDED_MINUTES:10}

# compose 헬스체크가 쓰는 health만 공개한다. db 연결이 끊기면 backend도 unhealthy가 된다.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
