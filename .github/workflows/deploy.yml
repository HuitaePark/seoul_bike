# main에 반영되면 배포 서버(self-hosted, macOS Apple Silicon)에서 직접 빌드하고 띄운다.
# 공개 저장소이므로 pull_request 이벤트는 받지 않는다. 외부인이 PR로 서버에서 코드를 실행하지 못하게 하기 위해서다.
name: deploy

on:
  push:
    branches: [main]
    paths:
      # compose가 빌드하는 폴더 전부. 새 서비스를 compose에 넣으면 여기에도 넣는다.
      - "infra/**"
      - "backend/**"
      - "frontend/**"
      - "agent/**"
      - "business-mcp/**"
      - "rag-mcp/**"
      - "docs/specs/**"
      - "docs/evidence/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'HuitaePark/skala_seoul_bike' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, seoul-bike]
    environment: production
    timeout-minutes: 30
    env:
      COMPOSE_FILE: infra/compose.yaml
      COMPOSE_PROJECT_NAME: seoul-bike
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker 확인
        run: docker info --format 'Docker {{.ServerVersion}} · {{.Architecture}}'

      # 값의 원본은 GitHub production 환경의 secret·variable이다 (infra/README "비밀값").
      # 서버 .env는 배포마다 새로 쓴다. 빈 값은 쓰지 않아 compose 기본값을 따른다. 값은 로그에 찍지 않는다.
      - name: 서버 .env 만들기
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VECTOR_PASSWORD: ${{ secrets.VECTOR_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          VECTOR_DB: ${{ vars.VECTOR_DB }}
          VECTOR_USER: ${{ vars.VECTOR_USER }}
          FAKE_AGENT_ENABLED: ${{ vars.FAKE_AGENT_ENABLED }}
          MCP_INTERNAL_MODE: ${{ vars.MCP_INTERNAL_MODE }}
          AGENT_LLM: ${{ vars.AGENT_LLM }}
          MCP_FAKE: ${{ vars.MCP_FAKE }}
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
        run: |
          required="POSTGRES_PASSWORD VECTOR_PASSWORD JWT_SECRET"
          optional="SEED_USER_PASSWORD INTERNAL_TOKEN OPENAI_API_KEY OLLAMA_API_KEY POSTGRES_DB POSTGRES_USER VECTOR_DB VECTOR_USER
                    FAKE_AGENT_ENABLED MCP_INTERNAL_MODE AGENT_LLM MCP_FAKE OLLAMA_HOST"
          for k in $required; do
            if [ -z "${!k}" ]; then
              echo "::error::production 환경 secret $k가 없다 (Settings → Environments → production)"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$HOME/seoul-bike"
          out="$HOME/seoul-bike/.env.new"
          : > "$out"
          for k in $required $optional; do
            if [ -n "${!k}" ]; then printf '%s=%s\n' "$k" "${!k}" >> "$out"; fi
          done
          mv "$out" "$HOME/seoul-bike/.env"
          echo "서버 .env를 production 환경 값 $(wc -l < "$HOME/seoul-bike/.env" | tr -d ' ')개로 새로 썼다"

      - name: 이미지 받기·빌드
        run: |
          docker compose --env-file "$HOME/seoul-bike/.env" pull --ignore-buildable
          docker compose --env-file "$HOME/seoul-bike/.env" build --pull

      - name: 기동과 헬스체크
        run: docker compose --env-file "$HOME/seoul-bike/.env" up -d --remove-orphans --wait --wait-timeout 300

      - name: 실패 시 상태와 로그
        if: failure()
        run: |
          docker compose --env-file "$HOME/seoul-bike/.env" ps
          docker compose --env-file "$HOME/seoul-bike/.env" logs --tail 200

      - name: 쓰지 않는 이미지 정리
        if: success()
        run: docker image prune -f
