# PR과 main 푸시에서 GitHub 호스팅 러너로만 검사한다. 서버(self-hosted) 러너는 여기서 쓰지 않는다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  or-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        working-directory: or-tools

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 테스트가 Testcontainers로 PostGIS·Redpanda를 띄운다 (러너의 Docker 사용).
      - run: ./gradlew test --no-daemon
        working-directory: services/backend

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OpenAPI 검증
        run: npx --yes @redocly/cli@2 lint docs/specs/openapi.yaml docs/specs/internal-api.yaml --format=summary
      - name: AsyncAPI 검증
        working-directory: docs/specs
        run: npx --yes @asyncapi/cli@6 validate asyncapi.yaml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose 파일 검증
        run: docker compose -f infra/compose.yaml --env-file infra/.env.example config -q
