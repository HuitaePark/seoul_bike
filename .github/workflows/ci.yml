# PR과 main 푸시에서 GitHub 호스팅 러너로만 검사한다. 서버(self-hosted) 러너는 여기서 쓰지 않는다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  or-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r or-tools/requirements-worker.txt -r or-tools/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: or-tools
      - name: 독립 Kafka 브로커 시작
        run: docker compose -f infra/optimizer/compose.kafka.yaml up -d --wait broker
      - name: 최적화 Kafka 송수신·재시작 검증
        working-directory: or-tools
        env:
          OPTIMIZER_KAFKA_BOOTSTRAP: 127.0.0.1:19092
        run: python -m pytest -q tests/integration/test_kafka_live.py
      - name: 독립 Kafka 테스트 환경 정리
        if: always()
        run: docker compose -f infra/optimizer/compose.kafka.yaml down --volumes

  # agent(그래프·Harness), business-mcp, rag-mcp의 pytest. rag-mcp의 색인·검색 테스트는 pgvector 서비스로 돈다.
  # agent의 Postgres 체크포인터 테스트(AGENT_TEST_PG_URL)와 rag-mcp의 임베딩 모델 테스트(RAG_TEST_FASTEMBED)는 건너뛴다.
  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: agent
            extra: dev
          - module: business-mcp
            extra: test
          - module: rag-mcp
            extra: test
            rag-dsn: postgresql://postgres:test@localhost:5432/rag
    name: python (${{ matrix.module }})
    # 서버와 같은 이미지. 세 모듈 모두 뜨지만 rag-mcp만 RAG_TEST_DSN으로 쓴다.
    services:
      vectordb:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[${{ matrix.extra }}]" pytest pytest-asyncio
        working-directory: ${{ matrix.module }}
      - run: python -m pytest -q ${{ matrix.pytest-args }}
        working-directory: ${{ matrix.module }}
        env:
          RAG_TEST_DSN: ${{ matrix.rag-dsn }}

  # 6번 데이터·시뮬레이터 테스트(sim, forecast, 대여소 수집기). 실데이터·네트워크 없이 가짜 입력으로만 돈다.
  # lightgbm이 쓰는 libgomp는 ubuntu 러너에 이미 깔려 있다.
  data:
    name: python (data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - run: pip install -r requirements-data.txt pytest
      # analysis/ 전체를 준다: 6번이 새로 넣는 test_*.py(예: test_truck_hours.py)가 따로 등록하지 않아도 돈다.
      - run: python -m pytest -q sim/tests forecast/tests analysis

  backend:
    runs-on: ubuntu-latest
    # 평소 2~3분. 테스트가 막혀도 기본 한도(6시간)까지 러너를 잡지 않는다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # 테스트가 Testcontainers로 PostGIS·Redpanda를 띄운다 (러너의 Docker 사용).
      - run: ./gradlew test --no-daemon
        working-directory: backend
      # 테스트 중 앱 로그(Kafka 리스너 배정·토픽 생성)는 콘솔에 안 나오고 결과 XML의 system-out에만 남는다.
      - name: 실패한 backend 테스트 기록
        if: failure() || cancelled()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # 계약(openapi.yaml)을 바꾸고 타입을 다시 생성하지 않았으면 실패한다.
      - name: API 타입이 계약과 같은지
        working-directory: frontend
        run: npm run gen:api && git diff --exit-code src/shared/api/schema.d.ts
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: 화면 검증용 Chromium 설치
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: 계획 검토 브라우저 검증
        run: npm run test:e2e
        working-directory: frontend
      - name: 실패한 화면 검사 기록
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-plan-review
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OpenAPI 검증
        run: npx --yes @redocly/cli@2 lint docs/specs/openapi.yaml docs/specs/internal-api.yaml --format=summary
      - name: AsyncAPI 검증
        working-directory: docs/specs
        run: npx --yes @asyncapi/cli@6 validate asyncapi.yaml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose 파일 검증
        run: docker compose -f infra/compose.yaml --env-file infra/.env.example config -q
      - name: 최적화 독립 개발 환경 검증
        run: |
          sh -n infra/optimizer/prepare-osrm.sh
          docker compose -f infra/optimizer/compose.dev.yaml --profile prepare --profile tools config -q
          docker compose -f infra/optimizer/compose.kafka.yaml config -q
